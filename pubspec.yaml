name: circuit_chat
description: "CircuitChat — Flutter (converted from React Native)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management (replaces @reduxjs/toolkit + react-redux) ──────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation (replaces @react-navigation/*) ───────────────────────────────
  go_router: ^14.6.2

  # ── Networking (replaces axios) ──────────────────────────────────────────────
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  http_parser: ^4.1.1

  # ── Secure Storage (replaces react-native-keychain) ─────────────────────────
  flutter_secure_storage: ^10.3.1

  # ── Audio Playback (replaces react-native-audio-recorder-player playback) ───
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # ── Audio Recording (replaces react-native-audio-recorder-player recording) ─
  record: ^6.2.1

  # ── Shared Preferences (replaces @react-native-async-storage/async-storage) ─
  shared_preferences: ^2.3.3

  # ── Image Loading & Caching (replaces react-native-fast-image) ──────────────
  cached_network_image: ^3.4.1

  # ── Firebase (replaces @react-native-firebase/*) ────────────────────────────
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6

  # ── Social Auth ──────────────────────────────────────────────────────────────
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.2.0
  sign_in_with_apple: ^6.1.4

  # ── Push Notifications (replaces @notifee/react-native) ─────────────────────
  flutter_local_notifications: ^18.0.1

  # ── Image Picker (replaces react-native-image-picker + image-crop-picker) ───
  image_picker: ^1.1.2

  # ── Video Player (replaces react-native-video) ──────────────────────────────
  video_player: ^2.9.2
  chewie: ^1.13.1

  # ── Connectivity (replaces @react-native-community/netinfo) ─────────────────
  connectivity_plus: ^6.1.1

  # ── Permissions (replaces react-native-permissions) ─────────────────────────
  permission_handler: ^11.3.1

  # ── Maps (replaces react-native-maps) ───────────────────────────────────────
  google_maps_flutter: ^2.10.0
  apple_maps_flutter: ^1.4.0

  # ── Agora (replaces react-native-agora + react-native-incall-manager) ────────
#  agora_rtc_engine: ^6.5.2

  # ── Geolocation (replaces react-native-geolocation-service) ─────────────────
  geolocator: ^13.0.2

  # ── WebView (replaces react-native-webview) ──────────────────────────────────
  webview_flutter: ^4.10.0

  # ── SVG (replaces react-native-svg) ─────────────────────────────────────────
  flutter_svg: ^2.0.13

  # ── File Picker (replaces @react-native-documents/picker + react-native-fs) ──
#  file_picker: ^8.1.6

  # ── Path Provider (file system paths, used by file_utils) ──────────────────
  path_provider: ^2.1.4

  # ── Socket.io (replaces socket.io-client) ────────────────────────────────────
  socket_io_client: ^3.0.2

  # ── UUID (same as uuid in RN) ─────────────────────────────────────────────────
  uuid: ^4.5.1

  # ── Contacts (replaces react-native-contacts) ────────────────────────────────
  flutter_contacts: ^1.1.9+2

  # ── Clipboard (replaces @react-native-clipboard/clipboard) ───────────────────
  # Flutter has Clipboard built-in; no extra package needed.

  # ── App Upgrade (replaces Siren / OTA patterns) ──────────────────────────────
  upgrader: ^11.4.0

  # ── Ads ───────────────────────────────────────────────────────────────────────
#  google_mobile_ads: ^9.1.0

  # ── URL Launcher ─────────────────────────────────────────────────────────────
  url_launcher: ^6.3.1

  # ── Share (replaces react-native-share) ─────────────────────────────────────
  share_plus: ^10.1.4

  # ── Device / Package Info ────────────────────────────────────────────────────
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.3

  # ── Crypto (MD5 caching keys etc.) ──────────────────────────────────────────
  crypto: ^3.0.6

  # ── HTML Rendering (replaces react-native-htmlview / webview html) ───────────
  flutter_html: ^3.0.0-beta.2

  # ── Shimmer Loading (replaces custom skeleton loaders) ───────────────────────
  shimmer: ^3.0.0

  # ── Pull to Refresh (replaces react-native-reanimated scroll patterns) ───────
  easy_refresh: ^3.4.0

  # ── Badges (notification counts) ─────────────────────────────────────────────
  badges: ^3.1.2

  # ── Country Code Picker ───────────────────────────────────────────────────────
  country_code_picker: ^3.0.0

  # ── OTP Input Field ───────────────────────────────────────────────────────────
  pinput: ^5.0.0

  # ── Stories / Swipeable Cards (replaces react-native-pager-view patterns) ─────
  story_view: ^0.16.6

  # ── Photo Viewer / Lightbox ───────────────────────────────────────────────────
  photo_view: ^0.15.0

  # ── Smooth Page Indicator ─────────────────────────────────────────────────────
  smooth_page_indicator: ^1.2.0+3

  # ── Lottie Animations (replaces custom loaders) ───────────────────────────────
  lottie: ^3.1.3

  # ── Date / Intl (replaces moment) ─────────────────────────────────────────────
  intl: ^0.20.2

  # ── JSON Annotation (required at runtime for json_serializable models) ─────────
  json_annotation: ^4.9.0

  # ── Icons ─────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  json_serializable: ^6.9.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # fonts:  (uncomment and add font files when available)
  #   - family: YourFont
  #     fonts:
  #       - asset: assets/fonts/YourFont-Regular.ttf
  #       - asset: assets/fonts/YourFont-Bold.ttf
  #         weight: 700
